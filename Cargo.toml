[workspace]
resolver = "2"
members = ["crates/xredis-core", "crates/xredis-app", "crates/xredis-gpui"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
xredis-core = { path = "crates/xredis-core" }
xredis-app = { path = "crates/xredis-app" }
# GPUI 只通过 gpui-kit 引入,版本钉死,升级要开工单
gpui-kit = "=0.9.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
dirs = "6"
keyring = "4"
# 只用于 v1 导入时解密 v1 的密码(算法和 v1 一致)
magic-crypt = "5"
tracing = "0.1"
urlencoding = "2"
# Redis 客户端:v1 用它踩平了重连和超时的坑;TLS 走 rustls
fred = { version = "10", features = ["enable-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
pem = "4"
# 剪贴板格式和 v1 相同(base64 加 zlib),版本也和 v1 一致
base64 = "0.23"
flate2 = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
# app 层:异步消息通道、取消令牌、Arc<dyn Backend>、多语言(rust-i18n 是作者的决定,gpui-component 自己也用它)
async-channel = "2"
tokio-util = "0.7"
async-trait = "0.1"
rust-i18n = { version = "4", features = ["load-path"] }
tempfile = "3"

# 磁盘(AGENTS.md「环境和磁盘」):不要增量编译缓存;调试信息只留行号,依赖不带调试信息
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
