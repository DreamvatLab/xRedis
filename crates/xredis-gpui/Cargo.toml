[package]
name = "xredis-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "xredis_gpui"
path = "src/lib.rs"

[[bin]]
name = "xredis"
path = "src/main.rs"

[dependencies]
xredis-core.workspace = true
xredis-app.workspace = true
# 只开 tree-sitter(只带 tree-sitter 运行时和 tree-sitter-json),给 JSON 语法高亮
gpui-kit = { workspace = true, features = ["tree-sitter"] }
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# 消息时间显示用本地时区(格式由 xredis-app 定,这里只取时区偏移);gpui 本来就依赖它
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# GUI 测试用假 Backend
xredis-app = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
bytes.workspace = true
