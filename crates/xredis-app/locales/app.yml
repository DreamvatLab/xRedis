  en: "Configuration error: %{detail}"
err.io:
  en: "Failed to %{action} %{path}: %{detail}"
err.keystore:
  en: "Key store error: %{detail}"
err.rule:
  en: "%{detail}"
err.not_found:
  en: "Not found: %{detail}"
err.import:
  en: "Import failed: %{detail}"
err.connect:
  en: "Could not connect: %{detail}"
err.auth:
  en: "Authentication failed: %{detail}"
err.timeout:
  en: "The operation timed out: %{detail}"
err.closed:
  en: "The connection was closed."
err.redis:
  en: "Redis error: %{detail}"
