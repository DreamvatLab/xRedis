# ---- 隐私政策 ----
privacy.title:
  en: "Privacy Policy"
privacy.intro_title:
  en: "Introduction"
privacy.intro:
  en: "Thank you for choosing to use our software. We value your privacy and are committed to protecting your personal information. This Privacy Policy aims to explain how we handle your data."
privacy.data_title:
  en: "Data Collection and Use"
privacy.data:
  en: "Our software does not collect, store, or transmit any personal data. All data processed by the software remains on your local device and is not shared with any external servers or third parties."
privacy.storage_title:
  en: "Local Storage"
privacy.storage:
  en: "Any information you input or generate while using the software is stored locally on your device. We do not have access to this data and it is solely under your control."
privacy.security_title:
  en: "Security"
privacy.security:
  en: "We take the security of your data seriously and implement appropriate measures to protect it. Since all data is stored locally, it is crucial that you also take steps to secure your device."
privacy.updates_title:
  en: "Updates to this Policy"
privacy.updates:
  en: "We may update this Privacy Policy from time to time. Any changes will be posted within the software and will be effective immediately upon posting."
privacy.contact_title:
  en: "Contact Us"
privacy.contact:
  en: "If you have any questions or concerns about this Privacy Policy, please contact us at [cs@dreamvat.com]."

# ---- 错误(core 的错误按种类翻译;名字等参数原样带出) ----
err.title:
  en: "Error"
